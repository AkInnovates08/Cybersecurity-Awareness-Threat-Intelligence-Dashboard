{% extends 'base.html' %}{% block content %}<section class="panel" style="max-width:520px;margin:60px auto"><span class="pill">ANALYST ACCESS</span><h1>Analyst Login</h1><p>Use environment-configured credentials. No credentials are hard-coded in production.</p>{% if error %}<p class="sev-HIGH">{{ error }}</p>{% endif %}<form method="post" action="/login"><p><input name="username" placeholder="Username" required style="width:100%;padding:12px;background:#0a1627;color:white;border:1px solid #243750;border-radius:8px"></p><p><input type="password" name="password" placeholder="Password" required style="width:100%;padding:12px;background:#0a1627;color:white;border:1px solid #243750;border-radius:8px"></p><button class="btn">Sign in</button></form></section>{% endblock %}
